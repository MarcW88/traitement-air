name: Lot 5 six-page targeted Playwright QA
on:
  push:
    branches: [editorial/industrial-pollutants-lot5-20261029]
    paths: ['.github/workflows/lot5-six-page-qa.yml']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Chromium screenshots accessibility and mobile
        run: |
          node .design-audit/run-visual-review.mjs \
            --route /solutions-traitement-air/traitement-cov-charbon-actif/ \
            --route /solutions-traitement-air/traitement-odeurs-industrielles/ \
            --route /solutions-traitement-air/traitement-ammoniac-industriel/ \
            --route /solutions-traitement-air/traitement-h2s-industriel/ \
            --route /solutions-traitement-air/destruction-ozone-industriel/ \
            --route /solutions-traitement-air/lavage-gaz-acides-industriels/ \
            --output .artifacts/lot5-six-pages
      - name: Fail on actual rendering defects
        run: |
          node - <<'JS'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('.artifacts/lot5-six-pages/report.json'));
          const problems=r.pages.flatMap(p=>Object.entries({
            status:p.httpStatus!==200,
            wrongH1:p.h1Count!==1,
            horizontalOverflow:p.horizontalOverflow,
            missingAlt:p.imagesWithoutAlt>0,
            brokenImages:p.brokenImages.length>0,
            errors:p.pageErrors.length>0||p.consoleErrors.length>0,
            imageArticleOverflow:p.editorialImages.some(e=>e.overflowsArticle)
          }).filter(([,v])=>v).map(([k])=>p.route+' '+p.viewport+' '+k));
          console.log(JSON.stringify({tested:r.pages.length,problems,accessibility:r.pages.map(p=>({route:p.route,viewport:p.viewport,axe:p.axeViolations.map(v=>({id:v.id,impact:v.impact,description:v.description,nodes:v.nodes.length}))}))},null,2));
          if(problems.length)process.exit(1);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lot5-six-page-qa
          path: .artifacts/lot5-six-pages

# Rerun following responsive fixes
