name: Lot 2 image generation (branch-only)
# Retry on up-to-date branch; no concurrent editorial writes.
on:
  push:
    branches: [editorial/industrial-dust-capture-lot2-20261029]
    paths: ['.github/workflows/lot2-bfl-branch.yml']
permissions:
  contents: write
jobs:
  generate-five:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial/industrial-dust-capture-lot2-20261029
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolate exactly five requests
        run: |
          mkdir -p .content/lot2-bfl
          cp .content/image-requests/solutions-traitement-air-depoussierage-industriel-editorial.json .content/lot2-bfl/
          cp .content/image-requests/solutions-traitement-air-extraction-fumees-soudage-editorial.json .content/lot2-bfl/
          cp .content/image-requests/problemes-poussieres-en-suspension-atelier-editorial.json .content/lot2-bfl/
          cp .content/image-requests/polluants-poussieres-bois-editorial.json .content/lot2-bfl/
          cp .content/image-requests/polluants-fumees-soudage-editorial.json .content/lot2-bfl/
          python scripts/generate_bfl_images.py --requests-dir .content/lot2-bfl --check-only
      - name: Generate five unique visuals only
        env:
          BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
        run: python scripts/generate_bfl_images.py --requests-dir .content/lot2-bfl
      - name: Restore generated status and commit assets
        run: |
          cp .content/lot2-bfl/*.json .content/image-requests/
          rm -rf .content/lot2-bfl
          git config user.name "traitement-air editorial automation"
          git config user.email "146358493+MarcW88@users.noreply.github.com"
          git add assets/generated .content/image-requests solutions-traitement-air problemes polluants content || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(lot2): generate five targeted editorial photos"
            git push origin HEAD:editorial/industrial-dust-capture-lot2-20261029
          fi
