name: Generate approved editorial images with BFL

on:
  pull_request:
    paths:
      - '.content/image-requests/**'
      - 'content/**/body.html'
      - 'scripts/generate_bfl_images.py'
      - '.github/workflows/generate-editorial-images.yml'
  push:
    branches: [main]
    paths:
      - '.content/image-requests/**'
      - 'content/**/body.html'
      - 'renovatie-plannen/**/index.html'
      - 'renovatieprojecten/**/index.html'
      - 'verduurzamen/**/index.html'
      - 'problemen-oplossen/**/index.html'
      - 'vakman-en-offertes/**/index.html'
      - 'doe-het-zelf/**/index.html'
      - 'scripts/generate_bfl_images.py'
      - '.github/workflows/generate-editorial-images.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bfl-editorial-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      work_needed: ${{ steps.inspect.outputs.work_needed }}
      pending_count: ${{ steps.inspect.outputs.pending_count }}
      reinsert_count: ${{ steps.inspect.outputs.reinsert_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate source-driven pages
        run: |
          python generate_pages.py
          python scripts/render_homepage_seo.py
      - name: Validate image requests and detect work
        id: inspect
        run: python scripts/generate_bfl_images.py --check-only --github-output "$GITHUB_OUTPUT"
      - name: Summary
        run: |
          echo "Pending generations: ${{ steps.inspect.outputs.pending_count }}"
          echo "Existing images to reinsert: ${{ steps.inspect.outputs.reinsert_count }}"
          echo "Work needed: ${{ steps.inspect.outputs.work_needed }}"

  generate:
    needs: plan
    if: github.event_name != 'pull_request' && needs.plan.outputs.work_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          clean: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate source-driven pages
        run: |
          python generate_pages.py
          python scripts/render_homepage_seo.py
      - name: Generate or restore approved images
        env:
          BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
          BFL_API_URL: https://api.bfl.ai/v1/flux-2-pro-preview
          BFL_TIMEOUT: '600'
          BFL_POLL_INTERVAL: '1'
        run: python scripts/generate_bfl_images.py
      - name: Commit generated assets and page integration
        run: |
          git config user.name "Marc Williame"
          git config user.email "146358493+MarcW88@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "chore(images): generate approved editorial images"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
