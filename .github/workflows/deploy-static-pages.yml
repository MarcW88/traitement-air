name: Deploy static site to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "problemes/**"
      - "guides/**"
      - "secteurs/**"
      - "solutions-traitement-air/**"
      - "polluants/**"
      - "air-interieur/**"
      - "outils/**"
      - "demander-un-devis/**"
      - "assets/generated/**"
      - "_next/static/css/**"
      - "index.html"
      - "favicon.svg"
      - "sitemap.xml"
      - "robots.txt"
      - "llms.txt"
      - "ai-info.txt"
      - "scripts/build_sitemap.py"
      - ".github/workflows/deploy-static-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: static-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify published page
        run: |
          test -f problemes/hygrometrie/index.html
          grep -q 'Hygrométrie industrielle : ce que mesure' problemes/hygrometrie/index.html
      - name: Generate sitemap with accurate lastmod
        run: python3 scripts/build_sitemap.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
