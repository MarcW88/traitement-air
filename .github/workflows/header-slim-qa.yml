name: Simplified site header QA
on:
  push:
    branches: [ux/header-simplifie-20261110]
    paths: ['.github/workflows/header-slim-qa.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/header-simplifie-20261110
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace header navigation on all static pages
        run: |
          python3 scripts/simplify_header_20261110.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          pages=[p for p in Path('.').rglob('index.html') if not any(x.startswith('.') or x in {'404','_next','assets','content','scripts','docs'} for x in p.parts[:-1])]
          assert len(pages)>=108,len(pages)
          for p in pages:
            s=p.read_text(encoding='utf-8')
            nav=re.search(r'<nav class="nav-links header-slim"[^>]*>(.*?)</nav>',s,re.S)
            assert nav, p
            nav=nav.group(1)
            for word in ('Solutions','Secteurs','Problèmes','Ressources','Demander un devis'):
              assert word in nav,(p,word)
            assert 'Explorer</summary>' not in nav,p
            assert 'Trouver une solution</a>' not in nav,p
            assert 'id="header-slim-css"' in s,p
          print('Validated navigation on',len(pages),'pages')
          PY
      - name: Commit only branch changes
        run: |
          git config user.name "traitement-air editorial automation"
          git config user.email "146358493+MarcW88@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "feat(ux): simplify main navigation across site" 
          git push origin HEAD:ux/header-simplifie-20261110
  visual-qa:
    needs: implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/header-simplifie-20261110
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Chromium and Axe audit of navigation on desktop and mobile
        run: |
          node .design-audit/run-visual-review.mjs \
            --route / \
            --route /secteurs/ \
            --route /secteurs/page/2/ \
            --route /solutions-traitement-air/ \
            --route /problemes/ \
            --route /polluants/ \
            --output .artifacts/header-slim
      - name: Validate 12 rendered pages
        run: |
          node - <<'JS'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('.artifacts/header-slim/report.json','utf8'));
          if(r.pages.length!==12)throw Error('Expected 12 desktop/mobile pages');
          const bad=[];
          for(const p of r.pages){
            const faults=[];
            if(p.httpStatus!==200)faults.push('HTTP '+p.httpStatus);
            if(p.h1Count!==1)faults.push('H1');
            if(p.horizontalOverflow)faults.push('horizontal overflow');
            if(p.brokenImages?.length)faults.push('broken images');
            if(p.pageErrors?.length||p.consoleErrors?.length)faults.push('JavaScript errors');
            if(p.axeViolations?.length)faults.push('axe '+p.axeViolations.map(a=>a.id).join(','));
            console.log(JSON.stringify({route:p.route,viewport:p.viewport,faults}));
            if(faults.length)bad.push(p.route+': '+faults.join(','));
          }
          if(bad.length)throw Error(bad.join('\n'));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: header-slim-desktop-mobile-axe
          path: .artifacts/header-slim
          retention-days: 14
