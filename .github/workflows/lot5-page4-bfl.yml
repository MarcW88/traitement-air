name: Lot 5 page4 H2S BFL branch only
on:
  push:
    branches: [editorial/industrial-pollutants-lot5-20261029]
    paths: ['.github/workflows/lot5-page4-bfl.yml']
permissions:
  contents: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial/industrial-pollutants-lot5-20261029
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          mkdir -p .content/lot5-page4
          cp .content/image-requests/solutions-traitement-air-traitement-h2s-industriel-editorial.json .content/lot5-page4/
          python scripts/generate_bfl_images.py --requests-dir .content/lot5-page4 --check-only
      - env:
          BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
        run: python scripts/generate_bfl_images.py --requests-dir .content/lot5-page4
      - run: |
          cp .content/lot5-page4/*.json .content/image-requests/
          rm -rf .content/lot5-page4
          git config user.name "traitement-air editorial automation"
          git config user.email "146358493+MarcW88@users.noreply.github.com"
          git add assets/generated .content/image-requests solutions-traitement-air content
          if ! git diff --cached --quiet; then
            git commit -m "images(lot5): integrate H2S treatment illustration"
            git push origin HEAD:editorial/industrial-pollutants-lot5-20261029
          fi
