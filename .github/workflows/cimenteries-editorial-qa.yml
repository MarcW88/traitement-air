name: Cimenteries editorial BFL and Chromium QA
on:
  push:
    branches: [editorial/secteurs-industries-complementaires-20261109]
    paths: ['.github/workflows/cimenteries-editorial-qa.yml', 'secteurs/traitement-air-cimenteries-carrieres/index.html']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cimenteries-bfl-qa
  cancel-in-progress: false
jobs:
  bfl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial/secteurs-industries-complementaires-20261109
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Process cimenteries request only
        env:
          BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
        run: |
          mkdir -p .content/auto-image-only
          cp .content/image-requests/secteurs-traitement-air-cimenteries-carrieres-editorial.json .content/auto-image-only/
          python scripts/generate_bfl_images.py --requests-dir .content/auto-image-only --check-only
          python scripts/generate_bfl_images.py --requests-dir .content/auto-image-only
      - name: Save generated image and integrate page
        run: |
          cp .content/auto-image-only/secteurs-traitement-air-cimenteries-carrieres-editorial.json .content/image-requests/
          git config user.name "traitement-air editorial automation"
          git config user.email "146358493+MarcW88@users.noreply.github.com"
          git add .content/image-requests/secteurs-traitement-air-cimenteries-carrieres-editorial.json assets/generated/secteurs-traitement-air-cimenteries-carrieres-editorial.webp secteurs/traitement-air-cimenteries-carrieres/index.html
          if ! git diff --cached --quiet; then
            git commit -m "images(cimenteries): generate and integrate BFL illustration"
            git push origin HEAD:editorial/secteurs-industries-complementaires-20261109
          fi
  qa:
    needs: bfl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial/secteurs-industries-complementaires-20261109
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Chromium screenshots and axe for desktop and mobile
        run: node .design-audit/run-visual-review.mjs --route /secteurs/traitement-air-cimenteries-carrieres/ --output .artifacts/cimenteries-review
      - name: Check two viewport reports for violations
        run: |
          node - <<'JS'
          const fs=require('fs');
          const p='.artifacts/cimenteries-review/report.json';
          if(!fs.existsSync(p))throw Error('Missing audit report');
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          if(r.pages.length!==2)throw Error('Expected two viewport reports');
          let bad=false;
          for(const row of r.pages){
            const defects={
              http:row.httpStatus!==200,
              h1:row.h1Count!==1,
              overflow:row.horizontalOverflow,
              brokenImages:row.brokenImages.length>0,
              missingAlt:row.imagesWithoutAlt>0,
              js:row.pageErrors.length>0||row.consoleErrors.length>0,
              axe:row.axeViolations.length>0,
              image:!row.editorialImages?.length,
              imageOverflow:row.editorialImages?.some(x=>x.overflowsArticle)===true
            };
            const errors=Object.keys(defects).filter(x=>defects[x]);
            console.log(JSON.stringify({viewport:row.viewport,errors,axe:row.axeViolations.map(x=>x.id),screenshot:row.screenshot}));
            if(errors.length)bad=true;
          }
          if(bad)process.exit(1);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cimenteries-chromium-desktop-mobile-axe
          path: .artifacts/cimenteries-review
          retention-days: 14
